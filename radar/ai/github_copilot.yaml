name: GitHub Copilot
shortname: Copilot
logo: https://github.githubassets.com/assets/copilot-logo-6cbbec34dd82.png
blip:
  - date: 2026-02-16
    ring: TRIAL
  - date: 2026-06-11
    ring: HOLD
description: |
  [GitHub Copilot](https://github.com/features/copilot) is an AI-powered code completion tool powered by third-party
  LLMs (e.g. Open AI, Claude Code and Gemini). It provides intelligent code suggestions, helps with boilerplate
  generation, and assists with refactoring across multiple programming languages. Copilot integrates directly into
  popular IDEs including VS Code, Visual Studio and JetBrains IDEs, offering real-time suggestions as developers
  type.
rationale: |
  We are moving GitHub Copilot to HOLD for two reasons:

  - **Strategic focus on Claude Code**: We are consolidating our AI-assisted development efforts around
    Anthropic's Claude Code. Its agentic approach to multi-step reasoning, codebase exploration, and
    iterative problem-solving aligns better with our specification-driven workflows. Rather than splitting
    investment across multiple AI coding tools, we want teams to focus evaluation efforts on Claude Code
    to build deeper expertise and establish consistent practices.

  - **Pricing model uncertainty**: GitHub has announced a shift to usage-based billing effective
    June 1, 2026. The new model replaces predictable per-seat pricing with AI Credits consumed based on
    token usage, making costs harder to forecast. Early reports suggest agentic coding sessions can
    consume $30-40 in credits per session, potentially increasing costs significantly for heavy users.
    We want to wait for the pricing model to stabilize and for clearer usage patterns to emerge before
    recommending further adoption. See [GitHub's announcement][copilot-billing].

  [copilot-billing]: https://github.blog/news-insights/company-news/github-copilot-is-moving-to-usage-based-billing/

  Teams currently using Copilot may continue, but new adoptions should evaluate Claude Code instead.
license:
  commercial:
    company: GitHub
    description: Available as GitHub Copilot Individual, Business, or Enterprise subscriptions
