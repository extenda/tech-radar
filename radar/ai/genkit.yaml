name: Genkit
blip:
  - date: 2026-02-17
    ring: ASSESS
description: |
  [Genkit](https://genkit.dev/) is a multi-model GenAI SDK from Google that helps developers build AI
  experiences with a consistent programming model. It provides abstractions for prompts, tools, and
  integrations so teams can embed AI features across services and frontends while staying flexible on
  model choices and deployment targets.
rationale: |
  We are assessing Genkit as a foundation for embedding AI capabilities in our services and frontends.
  It offers an opinionated SDK for composing prompts, tools, and flows, which could simplify development
  and improve consistency across teams. We want to evaluate its fit for our architecture, model
  portability, integration options, and the operational guardrails it provides for production usage.
license:
  open-source:
    name: Apache-2.0
    link: https://github.com/firebase/genkit/blob/main/LICENSE
tags:
