name: Spec Kit
shortname: Spec Kit
logo: https://raw.githubusercontent.com/github/spec-kit/main/media/logo_large.webp
blip:
  - date: 2026-02-16
    ring: ASSESS
  - date: 2026-06-11
    ring: HOLD
description: |
  [Spec Kit](https://github.com/github/spec-kit) is an AI-powered toolkit from GitHub for automatically
  generating specifications, tests, and documentation from code. It leverages large language models to analyze
  codebases and produce comprehensive specifications that can improve code quality, maintainability, and team
  collaboration. Spec Kit helps bridge the gap between code and documentation by automatically capturing
  intent and behavior.
rationale: |
  We are moving Spec Kit to HOLD in favor of OpenSpec for specification-driven development.

  While Spec Kit offers valuable capabilities for generating specifications from code, our evaluation
  identified several factors that make OpenSpec a better fit for our needs:

  - **Brownfield focus**: OpenSpec is designed from the ground up for incremental adoption in existing
    codebases, whereas Spec Kit's approach works best when integrated early in a project's lifecycle.

  - **Tool agnosticism**: OpenSpec works across 20+ AI assistants without vendor lock-in, while Spec Kit
    is tightly coupled to GitHub's ecosystem.

  - **Lighter weight**: OpenSpec's minimal footprint and simple slash-command workflow reduce friction
    for teams already using various AI coding tools.

  - **Persistent context**: OpenSpec's specification folders live alongside code in the repository,
    providing context that survives beyond individual chat sessions.

  Teams currently using Spec Kit may continue, but new specification-driven development initiatives
  should evaluate OpenSpec instead.
