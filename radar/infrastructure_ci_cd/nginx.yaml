name: Nginx
blip:
  - date: 2019-05-22
    ring: ASSESS
  - date: 2026-02-12
    ring: HOLD
description: |
  [nginx](https://www.nginx.com/) is a web server which can also be used as a reverse proxy,
  load balancer, mail proxy and HTTP cache.
rationale:
  We need to look into reverse proxies and load balancers.
  The product/service should be easy to setup and use regardless of k8s or Docker.

  In 2026, we see that we can accomplish most of our use cases with path-based routing in our load balancers
  in combination with CORS support in our ingestor sidecar.
related:
  - infrastructure_ci_cd/traefik.yaml
  - infrastructure_ci_cd/haproxy.yaml
tags:
  - devops
